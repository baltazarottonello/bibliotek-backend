services:
  proxy:
    image: nginx:latest
    ports:
      - 80:80
    volumes:
      - ./docker/proxy/nginx.conf:/etc/nginx/nginx.conf:ro
    depends_on:
      - frontend
      - api
    networks:
      - bibliotek-network

  frontend:
    build:
      context: C:\Users\balti\Escritorio\Dev\biblioteK\
      dockerfile: Dockerfile
    environment:
      FRONTEND_PORT: ${FRONTEND_PORT}
    ports:
      - ${FRONTEND_PORT}:${FRONTEND_PORT}

    depends_on:
      - api
    networks:
      - bibliotek-network

  api:
    build:
      context: .
      dockerfile: /docker/api/Dockerfile
    ports:
      - ${API_PORT}:${API_PORT}
    environment:
      DATABASE_HOST: ${DATABASE_HOST}
      DATABASE_PORT: ${DATABASE_CONTAINER_PORT}
      DATABASE_NAME: ${DATABASE_NAME}
      DATABASE_USERNAME: root
      DATABASE_ROOT_PASSWORD: ${DATABASE_ROOT_PASSWORD}
      CORS: ${CORS}
    depends_on:
      - db
    networks:
      - bibliotek-network

  db:
    image: mysql:8.0
    environment:
      MYSQL_ROOT_PASSWORD: ${DATABASE_ROOT_PASSWORD}
      MYSQL_DATABASE: ${DATABASE_NAME}
    ports:
      - ${DATABASE_EXTERNAL_PORT}:${DATABASE_CONTAINER_PORT}
    volumes:
      - ${BIND_MOUNT_PATH}:/var/lib/mysql
    networks:
      - bibliotek-network

networks:
  bibliotek-network:
    driver: bridge
